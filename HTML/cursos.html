<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; object-src 'none'; base-uri 'none'">
<title>Cadastro de cursos</title>
<link rel="stylesheet" href="CSS/style.css">
<script src="JAVASCRIPT/cadastro.js" defer></script>
<script src="JAVASCRIPT/renderer_cursos.js" defer></script>
</head>
<body>
<main>
<header>
<p class="subtitulo">ELECTRON + MYSQL</p>
<h1>Cadastro de cursos</h1>
<div class="acoes navegacao">
<button id="voltarMenu" type="button" class="secundario">Voltar ao menu</button>
<button id="sair" type="button" class="secundario">Sair</button>
</div>
</header>
<form id="formulario">
<h2 id="tituloFormulario">Novo curso</h2>
<label for="nome">Nome</label>
<input id="nome" name="nome" type="text" maxlength="100" required>
<label for="carga_horaria">Carga horária</label>
<input id="carga_horaria" name="carga_horaria" type="number" min="1" required>
<label for="descricao">Descrição</label>
<textarea id="descricao" name="descricao" maxlength="2000" rows="3"></textarea>
<div class="acoes">
<button id="salvar" type="submit">Cadastrar</button>
<button id="cancelar" type="button" class="secundario" hidden>Cancelar edição</button>
</div>
</form>
<p id="mensagem" role="status" aria-live="polite"></p>
<section aria-labelledby="titulolista">
<div id="cabecalhoRelatorio">
<h2>Relatório de cursos cadastrados</h2>
<p id="dataRelatorio"></p>
</div>
<div class="cabecalhoLista">
<h2 id="tituloLista">Cursos cadastrados</h2>
<div class="acoesLista">
<button id="recarregar" type="button" class="secundario">Atualizar lista</button>
<button id="imprimirRelatorio" type="button">Gerar relatório</button>
</div>
</div>
<table>
<caption id="resumo">Carregando registros...</caption>
<thead>
<tr>
<th scope="col">Código</th>
<th scope="col">Nome</th>
<th scope="col">Carga horária</th>
<th scope="col">Descrição</th>
<th scope="col">Ações</th>
</tr>
</thead>
<tbody id="lista"></tbody>
</table>
</section>
</main>
</body>
</html>
