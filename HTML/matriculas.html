<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; object-src 'none'; base-uri 'none'">
<title>Cadastro de matrículas</title>
<link rel="stylesheet" href="CSS/style.css">
<script src="JAVASCRIPT/cadastro.js" defer></script>
<script src="JAVASCRIPT/renderer_matriculas.js" defer></script>
</head>
<body>
<main>
<header>
<p class="subtitulo">ELECTRON + MYSQL</p>
<h1>Cadastro de matrículas</h1>
<div class="acoes navegacao">
<button id="voltarMenu" type="button" class="secundario">Voltar ao menu</button>
<button id="sair" type="button" class="secundario">Sair</button>
</div>
</header>
<form id="formulario">
<h2 id="tituloFormulario">Nova matrícula</h2>
<label for="aluno_id">Aluno</label>
<select id="aluno_id" name="aluno_id" required>
<option value="">Selecione o aluno</option>
</select>
<label for="curso_id">Curso</label>
<select id="curso_id" name="curso_id" required>
<option value="">Selecione o curso</option>
</select>
<label for="data_matricula">Data da matrícula</label>
<input id="data_matricula" name="data_matricula" type="date" required>
<div class="acoes">
<button id="salvar" type="submit">Cadastrar</button>
<button id="cancelar" type="button" class="secundario" hidden>Cancelar edição</button>
</div>
</form>
<p id="mensagem" role="status" aria-live="polite"></p>
<section aria-labelledby="titulolista">
<div id="cabecalhoRelatorio">
<h2>Relatório de matrículas cadastradas</h2>
<p id="dataRelatorio"></p>
</div>
<div class="cabecalhoLista">
<h2 id="tituloLista">Matrículas cadastradas</h2>
<div class="acoesLista">
<button id="recarregar" type="button" class="secundario">Atualizar lista</button>
<button id="imprimirRelatorio" type="button">Gerar relatório</button>
</div>
</div>
<table>
<caption id="resumo">Carregando registros...</caption>
<thead>
<tr>
<th scope="col">Código</th>
<th scope="col">Aluno</th>
<th scope="col">Curso</th>
<th scope="col">Data da matrícula</th>
<th scope="col">Ações</th>
</tr>
</thead>
<tbody id="lista"></tbody>
</table>
</section>
</main>
</body>
</html>
